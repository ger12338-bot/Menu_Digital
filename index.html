<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nopal:#123D36; --nopal-2:#1B5248; --brand:#0F7A66; --brand-ink:#fff;
  --chile:#C8372D; --maiz:#E2A329;
  --bg:#F2F5F2; --surface:#fff; --text:#18231F; --muted:#5E6E68; --line:#DCE3DE;
  --sidebar-text:#DCEBE5; --radius:12px; --radius-sm:8px;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0E1513;--surface:#16201D;--text:#E7EFEB;--muted:#93A59E;--line:#27352F;--brand:#2BB79C;--brand-ink:#08201A;--nopal:#0A211D;--nopal-2:#12302A}
}
:root[data-theme=dark]{--bg:#0E1513;--surface:#16201D;--text:#E7EFEB;--muted:#93A59E;--line:#27352F;--brand:#2BB79C;--brand-ink:#08201A;--nopal:#0A211D;--nopal-2:#12302A}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;border:0;border-radius:var(--radius-sm);padding:10px 16px;font-weight:600;background:var(--brand);color:var(--brand-ink);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.07)} button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--maiz);outline-offset:2px}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)}
.hidden{display:none!important}

/* Pantallas de acceso */
.gate{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--nopal),var(--nopal-2))}
.gate-card{background:var(--surface);border-radius:20px;padding:28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gate-card h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.gate-card p{color:var(--muted);margin-bottom:18px}
.gate-card label{display:block;font-weight:600;margin:12px 0 6px}
.users{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.users button{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.users button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.dots{display:flex;justify-content:center;gap:12px;margin:10px 0 16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)} .dots i.f{background:var(--brand);border-color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:16px;font-size:1.25rem;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.err{color:var(--chile);font-weight:600;min-height:22px;text-align:center;margin-top:10px}

/* App */
#app{display:grid;grid-template-columns:240px 1fr;height:100%}
.side{background:var(--nopal);color:var(--sidebar-text);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{font-weight:800;font-size:1.2rem;padding:4px 10px 16px;color:#fff;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--sidebar-text);padding:11px 12px}
.nav:hover{background:var(--nopal-2);filter:none} .nav.on{background:var(--brand);color:var(--brand-ink)}
.nav small{margin-left:auto;opacity:.6;font-weight:500}
.side .spacer{flex:1}
.who{padding:10px;font-size:.85rem;opacity:.85}
main{overflow:auto;padding:26px 30px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.top h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.pill b{width:9px;height:9px;border-radius:50%;background:var(--muted)} .pill.ok b{background:var(--brand)} .pill.bad b{background:var(--chile)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:1rem;margin-bottom:6px} .card p{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;margin-top:10px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tag.live{background:var(--brand);color:var(--brand-ink)}
.table{width:100%;border-collapse:collapse} .table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:left}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--text);color:var(--bg);padding:12px 16px;border-radius:var(--radius-sm);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.error{background:var(--chile);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:40}
.modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:420px;width:100%}
.modal h3{margin-bottom:8px} .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

.form label{display:block;font-weight:600;margin-top:12px;font-size:.9rem}.form input,.form select{margin-top:5px;font-weight:400}
select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input,.bar select{width:auto;flex:1;min-width:150px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{background:var(--surface);color:var(--text);border:1px solid var(--line)}.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}.tw .table th{font-size:.82rem;color:var(--muted)}
.mini{padding:6px 10px;font-size:.82rem;margin-right:4px}.off{opacity:.5}.muted{color:var(--muted)}
.badge{padding:2px 9px;border-radius:6px;font-size:.78rem;font-weight:700;background:var(--bg)}.badge.ok{background:var(--brand);color:var(--brand-ink)}.badge.warn{background:var(--chile);color:#fff}

.pos{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:start}
.pos-r{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;position:sticky;top:0;max-height:calc(100vh - 100px)}
.pos-r>div{padding:12px 14px}.cart{flex:1;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.chips button{white-space:nowrap;background:var(--surface);color:var(--text);border:1px solid var(--line)}.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);min-height:86px;gap:3px;padding:12px}.prod span{color:var(--brand);font-weight:800}.prod small{color:var(--muted);font-weight:500}.prod[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:4px}.seg button{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--line)}.seg button.on{background:var(--nopal);color:#fff;border-color:var(--nopal)}
.line{padding:9px 0;border-bottom:1px dashed var(--line)}.line .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}.line .l2{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{padding:2px 10px}.tot{display:flex;justify-content:space-between;padding:2px 0}.tot.big{font-size:1.4rem;font-weight:800}
.sub{font-size:.8rem;color:var(--muted)}.pay label{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600}.pay label span{width:110px}
@media(max-width:900px){.pos{grid-template-columns:1fr}.pos-r{position:static;max-height:none}}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.mesa{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;min-height:96px;padding:12px;background:var(--surface);color:var(--text);border:2px solid var(--line)}
.mesa b{font-size:1.25rem}.mesa small{color:var(--muted);font-weight:500}.mesa.oc{border-color:var(--brand)}.mesa.pc{border-color:var(--maiz)}.mesa.lt{box-shadow:0 0 0 3px var(--brand)}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.tk{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px}.tk.warn{border-color:var(--maiz)}.tk.late{border-color:var(--chile)}
.tk h4{display:flex;justify-content:space-between;font-size:1.05rem}.kit{display:flex;justify-content:space-between;gap:8px;width:100%;margin-top:6px;text-align:left;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.kit.Preparando{background:var(--maiz);color:#1a1200;border-color:var(--maiz)}.kit.Listo{background:var(--brand);color:var(--brand-ink)}
.h2{font-size:1.05rem;font-weight:800;margin:6px 0 10px}
.kpi b{display:block;font-size:1.45rem;margin-top:2px}.kpi span{color:var(--muted);font-size:.85rem}.den{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.den label{font-size:.85rem;font-weight:600}.den input{margin-top:3px;padding:8px}.big{font-size:1.2rem;font-weight:800}
.pwrap{display:flex;gap:6px}.pwrap input{flex:1}.pwrap button{padding:8px 12px;font-size:.85rem;white-space:nowrap}
.meter{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.recientes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.recientes button{padding:5px 10px;font-size:.8rem;background:var(--bg);color:var(--text);border:1px solid var(--line)}
@media(max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{flex-direction:row;order:2;padding:6px;overflow-x:auto}.brand,.who,.spacer,.nav small{display:none}
  .nav{flex-direction:column;gap:2px;font-size:.72rem;padding:8px 10px;width:auto;min-width:68px;text-align:center}
  main{padding:18px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="setup" class="gate hidden"><div class="gate-card">
  <h1>Conectar con Google Sheets</h1>
  <p>Pega la URL de tu aplicación web de Apps Script.</p>
  <label for="api-url">URL del Apps Script</label>
  <input id="api-url" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="err" id="setup-err"></div>
  <button style="width:100%;margin-top:8px" onclick="saveApiUrl()">Probar y guardar</button>
</div></section>

<section id="login" class="gate hidden"><div class="gate-card">
  <h1 id="login-title">POS Pro</h1>
  <p>Inicia sesión para continuar.</p>
  <form onsubmit="loginSubmit(event)" autocomplete="on">
    <label for="lg-user">Usuario</label>
    <input id="lg-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="lg-pass">Contraseña</label>
    <div class="pwrap"><input id="lg-pass" name="password" type="password" autocomplete="current-password" required><button type="button" class="ghost" id="lg-eye" onclick="togglePass()">Mostrar</button></div>
    <div class="err" id="login-err" role="alert"></div>
    <button type="submit" id="lg-btn" style="width:100%">Entrar</button>
  </form>
  <button class="ghost" style="width:100%;margin-top:8px" onclick="changeApiUrl()">Cambiar conexión</button>
</div></section>

<div id="app" class="hidden">
  <aside class="side">
    <div class="brand" id="brand">POS Pro</div>
    <div id="nav"></div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="ghost nav" style="color:var(--sidebar-text);border-color:var(--nopal-2);margin-bottom:6px" onclick="miCuenta()">Mi cuenta</button>
    <button class="ghost nav" style="color:var(--sidebar-text);border-color:var(--nopal-2)" onclick="logout()">Cerrar sesión</button>
  </aside>
  <main>
    <div class="top"><h2 id="view-title"></h2><div style="display:flex;gap:8px;align-items:center"><button class="pill hidden" id="menuSw" onclick="toggleMenu()"></button><span class="pill" id="conn"><b></b><span>Conectando</span></span></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts"></div>

<script>
/* ============ CORE: Estado ============ */
const S = { url: localStorage.getItem('pos_api_url') || '', token: sessionStorage.getItem('pos_token') || '', user: JSON.parse(sessionStorage.getItem('pos_user') || 'null'), config: {} };
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);

/* ============ CORE: API (único punto de contacto con Sheets) ============ */
const API = {
  async call(action, payload = {}) {
    // text/plain evita el preflight CORS de Apps Script
    const res = await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...payload }) });
    const j = await res.json();
    if (!j.ok) { if (j.error === 'SESION_EXPIRADA') { logout(); throw new Error('Tu sesión expiró. Ingresa de nuevo.'); } throw new Error(j.error); }
    return j.data;
  },
  list: t => API.call('list', { table: t }),
  save: (t, row, key) => API.call('save', { table: t, row, key }),
  deactivate: (t, id) => API.call('deactivate', { table: t, id }),
  nextFolio: () => API.call('nextFolio')
};

/* ============ CORE: UI ============ */
function toast(msg, type = 'info') { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; $('toasts').append(t); setTimeout(() => t.remove(), 3500); }
function confirmModal(title, msg, okText = 'Confirmar') {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3></h3><p style="color:var(--muted)"></p><div class="row"><button class="ghost">Cancelar</button><button>${okText}</button></div></div>`;
    bg.querySelector('h3').textContent = title; bg.querySelector('p').textContent = msg;
    const [no, yes] = bg.querySelectorAll('button'); no.onclick = () => { bg.remove(); res(false); }; yes.onclick = () => { bg.remove(); res(true); };
    document.body.append(bg); yes.focus();
  });
}

/* ============ Conexión y login ============ */
function show(id) { ['setup', 'login', 'app'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
async function saveApiUrl() {
  const url = $('api-url').value.trim(); $('setup-err').textContent = '';
  try { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'ping' }) }); if (!(await r.json()).ok) throw 0; S.url = url; localStorage.setItem('pos_api_url', url); initLogin(); }
  catch { $('setup-err').textContent = 'No se pudo conectar. Revisa que la URL termine en /exec y que el acceso sea "Cualquiera".'; }
}
function changeApiUrl() { show('setup'); $('api-url').value = S.url; }

function initLogin() {
  show('login'); $('login-err').textContent = '';
  $('login-title').textContent = localStorage.getItem('pos_negocio') || 'POS Pro';
  $('lg-user').value = localStorage.getItem('pos_last_user') || ''; $('lg-pass').value = '';
  ($('lg-user').value ? $('lg-pass') : $('lg-user')).focus();
}
function togglePass() { const i = $('lg-pass'); i.type = i.type === 'password' ? 'text' : 'password'; $('lg-eye').textContent = i.type === 'password' ? 'Mostrar' : 'Ocultar'; }
async function loginSubmit(e) {
  e.preventDefault(); const b = $('lg-btn'); $('login-err').textContent = ''; b.disabled = true; b.textContent = 'Entrando…';
  try {
    const r = await API.call('login', { usuario: $('lg-user').value, pass: $('lg-pass').value });
    S.token = r.token; S.user = r.user; sessionStorage.setItem('pos_token', r.token); sessionStorage.setItem('pos_user', JSON.stringify(r.user)); localStorage.setItem('pos_last_user', r.user.usuario);
    $('lg-pass').value = ''; startApp();
  } catch (x) { $('login-err').textContent = x.message; $('lg-pass').value = ''; $('lg-pass').focus(); }
  finally { b.disabled = false; b.textContent = 'Entrar'; }
}
function logout() { clearInterval(window._pwPoll); S.token = ''; S.user = null; sessionStorage.clear(); S.url ? initLogin() : show('setup'); }

/* ============ Módulos y router ============ */
// live:true = ya construido. Los demás se activan en su bloque.
const ALL = ['Admin', 'Gerente', 'Cajero', 'Mesero', 'Cocina'];
const MODULES = [
  { id: 'inicio', label: 'Inicio', icon: '🏠', roles: ALL, live: true, render: renderHome },
  { id: 'venta', label: 'Venta rápida', icon: '🧾', roles: ['Admin', 'Gerente', 'Cajero'], live: true, render: renderVenta },
  { id: 'mesas', label: 'Mesas y delivery', icon: '🍽️', roles: ['Admin', 'Gerente', 'Cajero', 'Mesero'], live: true, render: renderMesas },
  { id: 'cuenta', label: 'Cuenta', icon: '🧾', roles: ['Admin', 'Gerente', 'Cajero', 'Mesero'], live: true, hidden: true, render: renderVenta },
  { id: 'cocina', label: 'Cocina', icon: '👨‍🍳', roles: ['Admin', 'Gerente', 'Cajero', 'Cocina'], live: true, render: renderCocina },
  { id: 'caja', label: 'Caja', icon: '💵', roles: ['Admin', 'Gerente', 'Cajero'], live: true, render: () => renderCaja() },
  { id: 'historial', label: 'Historial', icon: '📋', roles: ['Admin', 'Gerente', 'Cajero'], live: true, render: renderVentas },
  { id: 'productos', label: 'Catálogo', icon: '🌮', roles: ['Admin', 'Gerente'], live: true, render: () => renderCatalog() },
  { id: 'inventario', label: 'Inventario', icon: '📦', roles: ['Admin', 'Gerente'], block: 7, desc: 'Insumos, recetas y costos reales.' },
  { id: 'reportes', label: 'Reportes', icon: '📊', roles: ['Admin', 'Gerente'], block: 10, desc: 'Dashboard, utilidad y comparativos.' },
  { id: 'usuarios', label: 'Usuarios', icon: '👤', roles: ['Admin'], live: true, render: renderUsers },
  { id: 'actividad', label: 'Actividad', icon: '🕘', roles: ['Admin'], live: true, render: renderLog },
  { id: 'config', label: 'Configuración', icon: '⚙️', roles: ['Admin'], live: true, render: renderConfig }
];
function startApp() {
  show('app');
  $('who').textContent = `${S.user.nombre} · ${S.user.rol}`;
  $('nav').innerHTML = ''; MODULES.filter(m => m.roles.includes(S.user.rol) && !m.hidden).forEach(m => {
    const b = document.createElement('button'); b.className = 'nav'; b.dataset.id = m.id; b.innerHTML = `<span>${m.icon}</span>${m.label}`; b.onclick = () => { location.hash = m.id; }; $('nav').append(b);
  });
  API.call('getConfig').then(c => { S.config = c; localStorage.setItem('pos_negocio', c.negocio || ''); $('brand').textContent = c.negocio || 'POS Pro'; document.title = c.negocio || 'POS Pro'; drawMenuSw(); setConn(true); }).catch(() => setConn(false));
  route();
  postLogin(); startWebPoll();
}
function setConn(ok) { const c = $('conn'); c.className = 'pill ' + (ok ? 'ok' : 'bad'); c.lastElementChild.textContent = ok ? 'Conectado a Sheets' : 'Sin conexión'; }
function route() {
  if (!S.user) return;
  clearInterval(window._poll);
  const m = MODULES.find(x => x.id === (location.hash.slice(1) || 'inicio') && x.roles.includes(S.user.rol)) || MODULES[0];
  document.querySelectorAll('.nav[data-id]').forEach(b => b.classList.toggle('on', b.dataset.id === (m.id === 'cuenta' ? 'mesas' : m.id)));
  $('view-title').textContent = m.label;
  m.live ? m.render() : ($('view').innerHTML = `<div class="card"><h3>Disponible en el Bloque ${m.block}</h3><p>${m.desc}</p></div>`);
}
window.addEventListener('hashchange', route);

function renderHome() {
  const cards = MODULES.slice(1).filter(m => m.roles.includes(S.user.rol) && !m.live).map(m => `<div class="card"><h3>${m.icon} ${m.label}</h3><p>${m.desc}</p><span class="tag">Bloque ${m.block}</span></div>`).join('');
  $('view').innerHTML = `<div class="card" style="margin-bottom:14px"><h3>Tu punto de venta está operativo</h3><p>Venta, mesas, cocina, delivery, caja con liquidación por propietario, historial y configuración están listos. Siguen inventario y reportes.</p><span class="tag live">Bloques 0 a 6 y 11</span></div><div class="grid">${cards}</div>`;
}

/* ============ Utilidades de formularios ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STR = [['', 0, 'transparent'], ['Débil', 25, 'var(--chile)'], ['Débil', 40, 'var(--chile)'], ['Regular', 60, 'var(--maiz)'], ['Buena', 80, 'var(--brand)'], ['Fuerte', 100, 'var(--brand)']];
function strength(p) { let n = 0; if (p.length >= 8) n++; if (p.length >= 12) n++; if (/[a-z]/.test(p) && /[A-Z]/.test(p)) n++; if (/\d/.test(p)) n++; if (/[^A-Za-z0-9]/.test(p)) n++; return p ? Math.max(1, n) : 0; }
function formModal(title, fields, vals = {}, note = '') {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${note ? `<p class="muted">${esc(note)}</p>` : ''}<div class="form">${fields.map(f => `<label>${esc(f.label)}${f.type === 'select' ? `<select id="f_${f.k}">${f.opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>` : `<input id="f_${f.k}" type="${f.type || 'text'}" ${f.attrs || ''}>`}${f.meter ? `<div class="meter"><i id="mt_${f.k}"></i></div><small class="sub" id="ml_${f.k}"></small>` : ''}</label>`).join('')}</div><div class="err" id="f_err" role="alert"></div><div class="row">${note.includes('obligatorio') ? '' : '<button class="ghost" id="f_no">Cancelar</button>'}<button id="f_ok">Guardar</button></div></div>`;
    fields.forEach(f => {
      const el = bg.querySelector('#f_' + f.k); el.value = vals[f.k] ?? f.def ?? '';
      if (f.meter) el.addEventListener('input', () => { const m = STR[strength(el.value)]; bg.querySelector('#mt_' + f.k).style.cssText = `width:${m[1]}%;background:${m[2]}`; bg.querySelector('#ml_' + f.k).textContent = m[0]; });
    });
    const no = bg.querySelector('#f_no'); if (no) no.onclick = () => { bg.remove(); res(null); };
    const ok = () => {
      const out = {}, err = m => bg.querySelector('#f_err').textContent = m;
      for (const f of fields) {
        let v = bg.querySelector('#f_' + f.k).value; if (f.type !== 'password') v = v.trim();
        if (f.req && v === '') return err(`Completa: ${f.label}`);
        if (f.min && v !== '' && v.length < f.min) return err(`${f.label}: mínimo ${f.min} caracteres`);
        if (f.pattern && v !== '' && !f.pattern.test(v)) return err(f.msg || `${f.label} no es válido`);
        if (f.type === 'number') { v = v === '' ? 0 : Number(v); if (v < 0 || isNaN(v)) return err(`${f.label} no es válido`); }
        out[f.k] = v;
      }
      bg.remove(); res(out);
    };
    bg.querySelector('#f_ok').onclick = ok; bg.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); ok(); } });
    document.body.append(bg); bg.querySelector('input,select').focus();
  });
}
async function run(fn, okMsg) { try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message, 'error'); } }

const saveUserLocal = () => sessionStorage.setItem('pos_user', JSON.stringify(S.user));
async function changeMyPass(forced = false) {
  const note = forced ? 'Es obligatorio crear tu contraseña personal antes de continuar. Mínimo 8 caracteres; mezcla letras y números.' : 'Mínimo 8 caracteres; mezcla letras y números.';
  const fields = (forced ? [] : [{ k: 'actual', label: 'Contraseña actual', type: 'password', req: true }]).concat([{ k: 'nueva', label: 'Nueva contraseña', type: 'password', req: true, min: 8, meter: true }, { k: 'nueva2', label: 'Repite la nueva contraseña', type: 'password', req: true }]);
  for (;;) {
    const v = await formModal('Contraseña', fields, {}, note); if (!v) return null;
    if (v.nueva !== v.nueva2) { toast('Las contraseñas no coinciden', 'error'); continue; }
    try { await API.call('changePass', { actual: v.actual, nueva: v.nueva }); S.user.cambiarPass = false; saveUserLocal(); toast('Contraseña actualizada'); return v.nueva; } catch (e) { toast(e.message, 'error'); }
  }
}
async function changeMyPin(forced = false, pw = '') {
  const note = forced ? 'Es obligatorio definir tu PIN de supervisor: autoriza descuentos, cancelaciones y devoluciones. Ya no sirve para entrar.' : 'El PIN de supervisor autoriza descuentos, cancelaciones y devoluciones. No sirve para entrar al sistema.';
  const pin = { type: 'password', req: true, attrs: 'inputmode="numeric" maxlength="4"', pattern: /^\d{4}$/, msg: 'El PIN son 4 números' };
  const fields = (pw ? [] : [{ k: 'actual', label: 'Tu contraseña', type: 'password', req: true }]).concat([{ k: 'pin', label: 'Nuevo PIN (4 dígitos)', ...pin }, { k: 'pin2', label: 'Repite el PIN', ...pin }]);
  for (;;) {
    const v = await formModal('PIN de supervisor', fields, {}, note); if (!v) return;
    if (v.pin !== v.pin2) { toast('Los PIN no coinciden', 'error'); continue; }
    try { await API.call('changePin', { pin: v.pin, actual: v.actual || pw }); S.user.pinPendiente = false; saveUserLocal(); return toast('PIN de supervisor actualizado'); } catch (e) { toast(e.message, 'error'); }
  }
}

/* ============ Bloque 3: Pantalla de venta ============ */
const P = { cart: [], canal: 'Mostrador', mesa: '', cliente: '', dir: '', envio: 0, nota: '', descCuenta: null, authPin: '', cat: '', q: '', prods: [], cats: [], props: [] };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const isMgr = () => ['Admin', 'Gerente'].includes(S.user.rol);

// Misma lógica que el servidor (el servidor es quien manda; esto es para mostrar)
function calc() {
  const L = P.cart.map(c => { const bruto = r2(c.precio * c.qty); const d = c.cortesia ? bruto : Math.min(bruto, c.desc || 0); return { ...c, bruto, d, dc: 0 }; });
  const base = r2(L.reduce((s, l) => s + l.bruto - l.d, 0)), D = P.descCuenta; let dcT = 0;
  if (D && D.valor > 0 && base > 0) dcT = D.tipo === 'pct' ? r2(base * Math.min(100, D.valor) / 100) : Math.min(base, r2(D.valor));
  const act = L.filter(l => l.bruto - l.d > 0); let rest = dcT;
  act.forEach((l, i) => { const n = l.bruto - l.d; l.dc = i === act.length - 1 ? Math.min(n, rest) : Math.min(n, rest, r2(dcT * n / base)); rest = r2(rest - l.dc); });
  L.forEach(l => l.neto = r2(l.bruto - l.d - l.dc));
  const envio = P.canal === 'Delivery' ? Math.max(0, r2(P.envio)) : 0;
  const total = r2(L.reduce((s, l) => s + l.neto, 0) + envio);
  const por = {}; L.forEach(l => por[l.propId] = r2((por[l.propId] || 0) + l.neto));
  if (envio) { const e = S.config.propietario_envios || 'P-001'; por[e] = r2((por[e] || 0) + envio); }
  return { L, subtotal: r2(L.reduce((s, l) => s + l.bruto, 0)), desc: r2(L.reduce((s, l) => s + l.d, 0) + dcT), envio, total, por };
}
function resetP() { Object.assign(P, { cart: [], canal: 'Mostrador', mesa: '', cliente: '', dir: '', envio: 0, nota: '', descCuenta: null, authPin: '', sesion: null, fresh: false, snap: '' }); }
const cartFromItems = its => its.map(i => ({ uid: i.uid, id: i.ProductoID, nombre: i.Producto, precio: i.Precio, propId: i.PropietarioID || (P.prods.find(p => p.ID === i.ProductoID) || {}).PropietarioID, libre: !!i.Libre, qty: i.Cantidad, nota: i.Nota, desc: i.Descuento || 0, cortesia: !!i.Cortesia, estado: i.Estado, cat: i.Categoria }));

  if (c) c.qty++; else P.cart.push({ id, nombre: p.Nombre, precio: Number(p.Precio), propId: p.PropietarioID, qty: 1, nota: '', desc: 0, cortesia: false });

function drawCart() {
  const T = calc(), prop = id => nameOf(P.props, id), ses = P.sesion, pend = l => !l.estado || l.estado === 'Pendiente';

/* ---- Cobro ---- */
async function cobrar() {

  if ((T.desc > 0 || P.cart.some(libreAlto)) && !(await needAuth())) return;
  if (P.canal === 'Mesa' && !P.mesa.trim()) return toast('Indica el número de mesa', 'error');

  bg.innerHTML = `<div class="modal pay" role="dialog" aria-modal="true"><h3>Cobrar ${money(T.total)}</h3>
  ${['Efectivo', 'Tarjeta', 'Transferencia'].map(m => `<label><span>${m}</span><input type="number" min="0" step="0.5" inputmode="decimal" data-m="${m}" placeholder="0"></label>`).join('')}
  <div class="bar" style="margin-top:10px"><button class="mini ghost" id="px">Exacto en efectivo</button>${[100, 200, 500].map(n => `<button class="mini ghost pq" data-n="${n}">$${n}</button>`).join('')}</div>
  <div class="tot" style="margin-top:8px"><span id="plabel">Falta</span><b id="pval"></b></div>
  <div class="bar" style="margin-top:6px"><span class="sub">Dividir entre</span><input id="psplit" type="number" min="1" value="1" style="width:70px;flex:none"><span class="sub" id="pper"></span></div>
  <label style="font-weight:500"><input type="checkbox" id="pprint" style="width:auto" ${localStorage.getItem('pos_print') === '0' ? '' : 'checked'}> Imprimir ticket</label>

  const ins = [...bg.querySelectorAll('input[data-m]')], val = m => Number(ins.find(i => i.dataset.m === m).value) || 0;
  const upd = () => {
    const ef = val('Efectivo'), paid = ef + val('Tarjeta') + val('Transferencia'), cambio = r2(paid - T.total), ok = paid >= T.total && cambio <= ef;
    bg.querySelector('#plabel').textContent = cambio >= 0 ? 'Cambio' : 'Falta'; bg.querySelector('#pval').textContent = money(Math.abs(cambio));
    bg.querySelector('#perr').textContent = paid >= T.total && cambio > ef ? 'El cambio solo puede salir de efectivo.' : '';
    bg.querySelector('#pok').disabled = !ok; const n = Math.max(1, Number(bg.querySelector('#psplit').value) || 1); bg.querySelector('#pper').textContent = n > 1 ? `${money(T.total / n)} por persona` : '';
  };

  bg.querySelectorAll('.pq').forEach(b => b.onclick = () => { ins[0].value = b.dataset.n; upd(); });
  bg.querySelector('#pno').onclick = () => bg.remove();
  bg.querySelector('#pok').onclick = async () => {

    try {
      const v = await API.call('registrarVenta', { canal: P.canal, mesa: P.mesa, cliente: P.cliente, direccion: P.dir, envio: P.envio, descCuenta: P.descCuenta, authPin: P.authPin, nota: P.nota, sesionId: P.sesion ? P.sesion.SesionID : '',
        items: P.cart.map(c => ({ ProductoID: c.id, Producto: c.nombre, Precio: c.precio, PropietarioID: c.propId, Cantidad: c.qty, Nota: c.nota, Descuento: c.desc, Cortesia: c.cortesia })),
        pagos: ins.map(i => ({ metodo: i.dataset.m, monto: Number(i.value) || 0 })) });
      bg.remove(); toast(`Venta #${v.folio} registrada` + (v.cambio ? ` · Cambio ${money(v.cambio)}` : ''));
      if (localStorage.getItem('pos_print') !== '0') printTicket(v);
      if (P.sesion) { resetP(); location.hash = 'mesas'; } else { clearCart(); API.list('Productos').then(r => { P.prods = r; drawGrid(); }); }
    } catch (e) { btn.disabled = false; btn.textContent = 'Confirmar cobro'; bg.querySelector('#perr').textContent = e.message; }
  };
  document.body.append(bg); ins[0].focus();
}

/* ---- Editor de cuenta ---- */
const sesPayload = (extra = {}) => ({ id: P.sesion.SesionID, mesa: P.mesa, canal: P.canal, cliente: P.cliente, direccion: P.dir, envio: P.envio, nota: P.nota, descCuenta: P.descCuenta, authPin: P.authPin, items: P.cart.map(c => ({ uid: c.uid || '', ProductoID: c.id, Producto: c.nombre, Precio: c.precio, PropietarioID: c.propId, Cantidad: c.qty, Nota: c.nota, Descuento: c.desc, Cortesia: c.cortesia })), ...extra });

  $('view').innerHTML = '<div class="bar"><select id="kcat" onchange="drawCocina()"><option value="">Todas las categorías</option></select></div><div class="kds" id="kds"></div>';
  try { (await API.list('Categorias')).filter(c => c.Activo).forEach(c => $('kcat').insertAdjacentHTML('beforeend', `<option value="${esc(c.ID)}">${esc(c.Nombre)}</option>`)); } catch (e) {}

  await draw(); poll(draw, 6000);

function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 250); } catch (e) {} }
function drawCocina() {

  const tk = SES.map(x => ({ x, its: x.Items.filter(i => live.includes(i.Estado) && (!f || i.Categoria === f)) })).filter(t => t.its.length).sort((a, b) => Math.min(...a.its.map(i => i.Hora)) - Math.min(...b.its.map(i => i.Hora)));
  const nuevos = tk.reduce((n, t) => n + t.its.filter(i => i.Estado === 'Nuevo').length, 0);
  if (KD.last !== null && nuevos > KD.last) beep(); KD.last = nuevos;

/* ============ Bloque 5: Caja, corte y liquidación ============ */
const CJ = { tab: 'turno', cur: null, liq: null, hist: [] };
const DENOMS = [1000, 500, 200, 100, 50, 20, 10, 5, 2, 1, 0.5];
const fdate = t => new Date(t).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
async function renderCaja() {

  try { CJ.cur = await API.call('turnoActual'); if (CJ.tab === 'liq') CJ.liq = await API.call('liquidacion'); if (CJ.tab === 'hist') CJ.hist = (await API.list('Turnos')).filter(t => t.Estatus === 'Cerrado').reverse(); } catch (e) { return toast(e.message, 'error'); }
  drawCaja();
}
const cajaTab = t => { CJ.tab = t; renderCaja(); };
function drawCaja() {

}

  return `<div class="bar"><span class="pill ok"><b></b>${esc(turno.ID)} · abierto ${fdate(turno.Apertura)} por ${esc(turno.Usuario)}</span><span style="margin-left:auto"></span><button class="ghost" onclick="movCaja()">Entrada / salida de efectivo</button><button onclick="cerrarCaja()">Cerrar caja (corte)</button></div>
  <div class="grid" style="margin-bottom:16px">${k('Efectivo esperado en caja', r.esperado)}${k(`Ventas (${r.nVentas})`, r.ventasTotal)}${k('Efectivo cobrado', r.metodos.Efectivo)}${k('Tarjeta', r.metodos.Tarjeta)}${k('Transferencia', r.metodos.Transferencia)}</div>

function cerrarCaja() {

/* ---- Liquidación por propietario ---- */

/* ============ Bloque 6: Historial y correcciones ============ */
const HV = { tab: 'lista', desde: '', hasta: '', rows: [], rep: null, props: [], truncado: false, turnoId: null, f: { canal: '', metodo: '', estatus: '', q: '', prop: '' } };
const today = () => new Date().toLocaleDateString('sv-SE');
const estatusVenta = v => v.Estatus === 'Cancelada' ? 'Cancelada' : Number(v.Devuelto) > 0 ? (Number(v.Devuelto) >= Number(v.Total) ? 'Devuelta' : 'Dev. parcial') : 'Pagada';
function rangoRapido(k) {
  const d = new Date(), f = x => x.toLocaleDateString('sv-SE'); let a = new Date(d), b = new Date(d);
  if (k === 'ayer') { a.setDate(a.getDate() - 1); b = new Date(a); }
  else if (k === 'semana') a.setDate(a.getDate() - ((a.getDay() + 6) % 7));
  else if (k === 'mes') a.setDate(1);
  else if (k === 'mespasado') { a = new Date(d.getFullYear(), d.getMonth() - 1, 1); b = new Date(d.getFullYear(), d.getMonth(), 0); }
  $('hd').value = f(a); $('hh').value = f(b); cargarVentas();
}
async function renderVentas() {
  if (!HV.desde) HV.desde = HV.hasta = today();
  const mgr = isMgr(); if (!mgr) HV.tab = 'lista';
  $('view').innerHTML = `${mgr ? `<div class="tabs"><button class="${HV.tab === 'lista' ? 'on' : ''}" onclick="HV.tab='lista';renderVentas()">Ventas</button><button class="${HV.tab === 'prop' ? 'on' : ''}" onclick="HV.tab='prop';renderVentas()">Por propietario</button></div>` : ''}
  <div class="bar"><label class="sub">Desde <input type="date" id="hd" value="${HV.desde}" style="width:auto"></label><label class="sub">Hasta <input type="date" id="hh" value="${HV.hasta}" style="width:auto"></label><button onclick="cargarVentas()">Buscar</button><button class="ghost" onclick="exportCSV()">Exportar CSV</button></div>
  <div class="chips">${[['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['mespasado', 'Mes pasado']].map(r => `<button onclick="rangoRapido('${r[0]}')">${r[1]}</button>`).join('')}</div><div id="hfilters"></div><div id="hres"></div>`;
  if (mgr && !HV.props.length) { try { HV.props = await API.list('Propietarios'); } catch (e) {} }
  cargarVentas();
}
async function cargarVentas() {
  HV.desde = $('hd').value || today(); HV.hasta = $('hh').value || HV.desde;
  const desde = new Date(HV.desde + 'T00:00:00').toISOString(), hasta = new Date(HV.hasta + 'T23:59:59.999').toISOString();
  $('hres').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    if (HV.tab === 'prop') { HV.rep = await API.call('reportePropietarios', { desde, hasta }); drawFilters(); return drawProp(); }
    const [r, t] = await Promise.all([API.call('ventasLista', { desde, hasta, propietarioId: HV.f.prop || '' }), API.call('turnoActual')]);
    HV.rows = r.ventas; HV.truncado = r.truncado; HV.turnoId = t.turno ? t.turno.ID : null;
  } catch (e) { return toast(e.message, 'error'); }
  drawFilters(); drawVentas();
}
function drawFilters() {
  const sel = (key, opts, all) => `<select onchange="HV.f.${key}=this.value;drawVentas()">${opts.map(c => `<option value="${c}" ${HV.f[key] === c ? 'selected' : ''}>${c || all}</option>`).join('')}</select>`;
  $('hfilters').innerHTML = HV.tab !== 'lista' ? '' : `<div class="bar"><input id="hq" placeholder="Folio, cliente, mesa o usuario" value="${esc(HV.f.q)}" oninput="HV.f.q=this.value;drawVentas()">${sel('canal', ['', 'Mostrador', 'Mesa', 'Delivery'], 'Todos los canales')}${sel('metodo', ['', 'Efectivo', 'Tarjeta', 'Transferencia', 'Mixto'], 'Todos los métodos')}${sel('estatus', ['', 'Pagada', 'Dev. parcial', 'Devuelta', 'Cancelada'], 'Todos los estatus')}${isMgr() ? `<select onchange="HV.f.prop=this.value;cargarVentas()"><option value="">Todos los propietarios</option>${HV.props.map(o => `<option value="${esc(o.ID)}" ${HV.f.prop === o.ID ? 'selected' : ''}>${esc(o.Nombre)}</option>`).join('')}</select>` : ''}</div>`;
}
const filtradas = () => { const f = HV.f, q = f.q.toLowerCase(); return HV.rows.filter(v => (!f.canal || v.Canal === f.canal) && (!f.metodo || v.Metodo === f.metodo) && (!f.estatus || estatusVenta(v) === f.estatus) && (!q || [v.Folio, v.Cliente, v.Mesa, v.Usuario].some(x => String(x).toLowerCase().includes(q)))); };
function drawVentas() {

  const last = localStorage.getItem('pos_libre_owner'), bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>Producto libre</h3><p class="muted">Para casos extraordinarios que no están en el menú.</p>
  ${rec.length ? `<div class="sub">Recientes</div><div class="recientes">${rec.map((r, i) => `<button data-i="${i}">${esc(r.n)} · ${money(r.p)}</button>`).join('')}</div>` : ''}
  <div class="form"><label>Producto<input id="l_n" maxlength="60" autocomplete="off"></label><label>Precio unitario ($)<input id="l_p" type="number" min="0" step="0.5" inputmode="decimal"></label><label>Cantidad<input id="l_c" type="number" min="1" step="1" value="1" inputmode="numeric"></label>
  <label>Propietario (dueño del producto)<select id="l_o">${owners.map(o => `<option value="${esc(o.ID)}" ${o.ID === last ? 'selected' : ''}>${esc(o.Nombre)}</option>`).join('')}</select></label><label>Nota (opcional)<input id="l_t" maxlength="120"></label>
  ${isMgr() ? '<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="l_g" style="width:auto"> Guardar también en el menú</label>' : ''}</div>
  <div class="tot" style="margin-top:8px"><span>Total</span><b id="l_tot">$0.00</b></div><div class="err" id="l_e" role="alert"></div><div class="row"><button class="ghost" id="l_x">Cancelar</button><button id="l_ok">Agregar</button></div></div>`;
  const q = id => bg.querySelector(id), upd = () => { q('#l_tot').textContent = money((Number(q('#l_p').value) || 0) * (Math.floor(Number(q('#l_c').value)) || 0)); };
  bg.addEventListener('input', upd); q('#l_x').onclick = () => bg.remove();
  bg.querySelectorAll('.recientes button').forEach(b => b.onclick = () => { const r = rec[b.dataset.i]; q('#l_n').value = r.n; q('#l_p').value = r.p; q('#l_o').value = r.o; upd(); q('#l_c').focus(); });
  const go = async () => {
    const n = q('#l_n').value.trim(), pr = r2(q('#l_p').value), c = Math.floor(Number(q('#l_c').value)), o = q('#l_o').value, nota = q('#l_t').value.trim(), err = m => q('#l_e').textContent = m;
    if (!n) return err('Escribe el nombre del producto.'); if (!(pr > 0)) return err('El precio debe ser mayor a 0.'); if (!(c >= 1)) return err('La cantidad debe ser al menos 1.');
    if (!isMgr() && topeLibre() > 0 && pr * c > topeLibre()) { if (!(await needAuth())) return; }
    localStorage.setItem('pos_libre_owner', o); localStorage.setItem('pos_libres', JSON.stringify([{ n, p: pr, o }].concat(rec.filter(r => !(r.n === n && r.p === pr && r.o === o))).slice(0, 8)));
    if (q('#l_g') && q('#l_g').checked) {
      try { const prod = await API.save('Productos', { ID: '', Nombre: n, Categoria: '', PropietarioID: o, Precio: pr, Costo: 0, Imagen: '', Activo: true, Disponible: true }); P.prods.push(prod); drawGrid(); for (let i = 0; i < c; i++) addItem(prod.ID); if (nota) { const l = P.cart.find(x => x.id === prod.ID); if (l) { l.nota = nota; drawCart(); } } toast('Agregado y guardado en el menú'); }
      catch (e) { return err(e.message); }
    } else { P.cart.push({ id: 'LIBRE', nombre: n, precio: pr, propId: o, qty: c, nota, desc: 0, cortesia: false, libre: true }); drawCart(); toast('Producto libre agregado'); }
    bg.remove();
  };
  q('#l_ok').onclick = go; bg.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); go(); } });
  document.body.append(bg); q('#l_n').focus();
}

/* ============ Menú digital: pedidos web ============ */
const PW = { n: null };
function drawMenuSw() {
  const b = $('menuSw'); if (!b) return; const on = String(S.config.menu_abierto) === '1', ok = !['Cocina', 'Mesero'].includes(S.user.rol);
  b.className = 'pill ' + (on ? 'ok' : 'bad') + (ok ? '' : ' hidden'); b.innerHTML = `<b></b>Menú web: ${on ? 'Abierto' : 'Cerrado'}`;
}
async function toggleMenu() {
  const on = String(S.config.menu_abierto) === '1';
  if (on && !(await confirmModal('Cerrar menú web', 'Los clientes ya no podrán hacer pedidos a domicilio hasta que lo abras de nuevo.', 'Cerrar menú'))) return;
  run(async () => { await API.call('menuToggle', { abierto: !on }); S.config.menu_abierto = on ? '0' : '1'; drawMenuSw(); }, on ? 'Menú web cerrado' : 'Menú web abierto');
}
function startWebPoll() {
  clearInterval(window._pwPoll); if (!['Admin', 'Gerente', 'Cajero', 'Mesero'].includes(S.user.rol)) return; PW.n = null;
  const tick = async () => {
    if (document.hidden) return;
    try {
      const r = await API.call('pedidosWebConteo');
      if (PW.n !== null && r.n > PW.n) { beep(); toast('🌐 Nuevo pedido web por aprobar'); }
      PW.n = r.n; const b = document.querySelector('.nav[data-id="mesas"]');
      if (b) { let m = b.querySelector('small'); if (!m) { m = document.createElement('small'); b.append(m); } m.textContent = r.n ? '🌐 ' + r.n : ''; }
    } catch (e) {}
  };
  tick(); window._pwPoll = setInterval(tick, 20000);
}
function webBanner(x) {
  if (!x || x.Origen !== 'Web') return '';
  return `<div class="box" style="margin-bottom:8px">🌐 <b>${esc(x.FolioWeb)}</b> · 📞 ${esc(x.Telefono)}<br>Pago: <b>${esc(x.PagoWeb)}</b>${x.PagaCon ? ' · paga con ' + money(x.PagaCon) : ''}${x.PagoWeb === 'Transferencia' ? '<br>⚠ Verifica el comprobante antes de cobrar' : ''}${x.Estado === 'PorAprobar' ? '<br>⏳ Por aprobar: usa “Enviar a cocina” para aceptarlo' : ''}</div>`;
}
function webSection(l) {
  if (!l.length) return '';
  return `<div class="h2">🌐 Pedidos web por aprobar</div><div class="grid" style="margin-bottom:22px">${l.map(x => `<div class="card"><b>${esc(x.FolioWeb)} · ${esc(x.Cliente)}</b> <span class="sub">hace ${mins(x.Creada)} min</span><p class="sub" style="margin:4px 0">📞 ${esc(x.Telefono)}<br>📍 ${esc(x.Direccion)}${x.Nota ? '<br>📝 ' + esc(x.Nota) : ''}</p><div class="sub">${x.Items.map(i => `${i.Cantidad}× ${esc(i.Producto)}`).join('<br>')}</div><div class="tot"><span>${esc(x.PagoWeb)}${x.PagaCon ? ' · paga con ' + money(x.PagaCon) : ''}</span><b>${money(sesTotal(x))}</b></div><div class="bar" style="margin:8px 0 0"><button class="mini" onclick="aceptarWeb('${x.SesionID}')">Aceptar y enviar a cocina</button><button class="mini ghost" onclick="abrirSesion('${x.SesionID}')">Ver / editar</button><button class="mini ghost" onclick="rechazarWeb('${x.SesionID}')">Rechazar</button></div></div>`).join('')}</div>`;
}
function aceptarWeb(id) {
  run(async () => { const r = await API.call('pedidoWebAceptar', { id }); if (localStorage.getItem('pos_comanda') !== '0') printComanda(r.ses, r.nuevos); await loadSes(); drawMesas(); }, 'Pedido aceptado y enviado a cocina');
}
async function rechazarWeb(id) {
  const v = await formModal('Rechazar pedido web', [{ k: 'm', label: 'Motivo (lo verá el cliente)', req: true, def: 'Fuera de zona de entrega' }]); if (!v) return;
  run(async () => { await API.call('pedidoWebRechazar', { id, motivo: v.m }); await loadSes(); drawMesas(); }, 'Pedido rechazado');
}
function ubicLocal() {
  if (!navigator.geolocation) return toast('Tu navegador no permite ubicación', 'error');
  navigator.geolocation.getCurrentPosition(p => { $('c_local_lat').value = p.coords.latitude.toFixed(6); $('c_local_lng').value = p.coords.longitude.toFixed(6); toast('Ubicación capturada. Guarda los cambios.'); }, () => toast('No se pudo obtener la ubicación', 'error'), { enableHighAccuracy: true, timeout: 15000 });
}

/* ============ Arranque ============ */
(S.url ? (S.token && S.user ? startApp : initLogin) : () => show('setup'))();
</script>
