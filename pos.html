<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Pro | Tacos & Papas Asadas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           1. ESTILOS BASE Y GENERALES DE LA TERMINAL
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #060606;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e0e0;
            padding-bottom: 20px;
        }

        /* Contenedor Principal POS */
        .pos-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        /* Header POS */
        .pos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pos-header h1 {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .pos-header p {
            color: #666;
            font-size: 0.85rem;
        }

        /* TOGGLE DE MODO DE VENTA (MOSTRADOR VS MESAS) */
        .mode-toggle-container {
            display: flex;
            background: #121212;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 4px;
            gap: 4px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ff5500, #ff8c00);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3);
        }

        /* GRID Y TARJETAS DE MESAS */
        .mesas-panel-container {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .mesas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        .mesa-card {
            background: #181818;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 80px;
            position: relative;
        }

        .mesa-card:hover {
            border-color: #ff5500;
            transform: translateY(-2px);
        }

        .mesa-card.libre {
            border-left: 4px solid #25D366;
        }

        .mesa-card.ocupada {
            background: rgba(255, 85, 0, 0.1);
            border: 1px solid #ff5500;
            border-left: 4px solid #ff5500;
        }

        .mesa-card.seleccionada {
            box-shadow: 0 0 0 2px #fff;
        }

        .mesa-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: #fff;
        }

        .mesa-status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .mesa-card.libre .mesa-status-badge { color: #25D366; }
        .mesa-card.ocupada .mesa-status-badge { color: #ff944d; }

        /* Barra de búsqueda */
        .search-container {
            position: relative;
            margin-bottom: 15px;
            width: 100%;
        }

        .search-container i.fa-magnifying-glass {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff5500;
            font-size: 1.1rem;
        }

        .search-bar {
            width: 100%;
            background: #121212;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 14px 45px;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: #ff5500;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.2);
            outline: none;
        }

        .clear-search-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
            transition: color 0.2s;
        }

        .clear-search-btn:hover { color: #ff3344; }

        /* Categorías */
        .categories-nav {
            display: flex;
            gap: 10px;
            padding: 5px 0 15px 0;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .categories-nav::-webkit-scrollbar { display: none; }

        .category-btn {
            background: #121212;
            color: #9e9e9e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: all 0.25s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .category-btn:hover {
            color: #fff;
            border-color: rgba(255, 85, 0, 0.5);
            background: #161616;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #ff5500, #ff8c00);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3);
        }

        /* Catálogo de Productos Grid */
        .pos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .pos-card {
            background: #121212;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            user-select: none;
            cursor: pointer;
        }

        .pos-card:hover {
            border-color: #ff5500;
            transform: translateY(-2px);
        }

        .pos-card:active {
            transform: scale(0.97);
            border-color: #25d366;
        }

        .pos-card h3 {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .pos-card .price {
            color: #ff944d;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .pos-card-agotado {
            opacity: 0.4;
            cursor: not-allowed !important;
            border-color: rgba(255, 51, 68, 0.2) !important;
        }

        .pos-badge-agotado {
            color: #ff3344;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .flash-effect { animation: cardFlash 0.35s ease-out; }
        @keyframes cardFlash {
            0% { background: #121212; }
            30% { background: rgba(255, 85, 0, 0.2); border-color: #ff5500; }
            100% { background: #121212; }
        }

        /* Panel Lateral del Ticket */
        .pos-sidebar {
            background: #111111;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.04);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .ticket-list {
            flex: 1;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            margin: 12px 0;
            padding-right: 5px;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: rowSlideIn 0.2s ease-out;
        }

        @keyframes rowSlideIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .ticket-controls { 
            display: flex;
            align-items: center;
            background: #161616;
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.04);
            gap: 6px;
        }

        .ticket-btn {
            background: #252525;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .ticket-btn:hover { background: #ff5500; color: #fff; }

        /* Formulario de Pago */
        .fast-cash-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 12px;
        }

        .cash-pill {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.04);
            color: #e0e0e0;
            padding: 8px 2px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .cash-pill:hover {
            background: #ff5500;
            color: #fff;
        }

        .pos-input {
            width: 100%;
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .pos-input:focus { border-color: #ff5500; outline: none; }

        .calc-box {
            background: #161616;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .change-alert {
            color: #25D366;
            font-weight: 800;
            font-size: 1.2rem;
        }

        .submit-order-btn {
            width: 100%;
            color: #fff;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Estilos de Modales Responsivos */
        .pos-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 15px;
        }

        .pos-modal-card {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        /* ==========================================
           2. REGLAS RESPONSIVAS (MÓVILES Y TABLETS)
           ========================================== */
        @media (max-width: 1024px) {
            .pos-container {
                grid-template-columns: 1fr;
            }

            .pos-sidebar {
                position: relative;
                top: 0;
                max-height: none;
                margin-top: 15px;
            }
        }

        @media (max-width: 600px) {
            .pos-container { padding: 10px; }
            .pos-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
            .pos-card { padding: 12px; min-height: 100px; }
            .pos-card h3 { font-size: 0.85rem; }
            .pos-card .price { font-size: 1rem; }
            .fast-cash-container { grid-template-columns: repeat(5, 1fr); }
            .cash-pill { padding: 10px 0; font-size: 0.75rem; }

            .pos-modal-card {
                padding: 18px;
                border-radius: 20px;
            }
            .pos-modal-actions {
                flex-direction: column !important;
            }
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <!-- ÁREA IZQUIERDA: MENÚ, MODO MESAS Y FILTROS -->
        <div>
            <div class="pos-header">
                <div>
                    <h1>PUNTO DE VENTA</h1>
                    <p>Tacos & Papas Asadas Sucursal Pilares</p>
                </div>

                <!-- SELECTOR DE MODO: MOSTRADOR vs MESAS -->
                <div class="mode-toggle-container">
                    <button class="mode-btn active" id="btnModoMostrador" onclick="cambiarModoPOS('mostrador')">
                        <i class="fa-solid fa-store"></i> Mostrador
                    </button>
                    <button class="mode-btn" id="btnModoMesas" onclick="cambiarModoPOS('mesas')">
                        <i class="fa-solid fa-chair"></i> Mesas
                    </button>
                </div>
            </div>

            <!-- PANEL CONTENEDOR DE MESAS (SE MUESTRA SOLO EN MODO MESAS) -->
            <div id="mesasPanelContainer" class="mesas-panel-container" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 0.8rem; font-weight: 800; color: #888; text-transform: uppercase;">
                        <i class="fa-solid fa-utensils" style="color: #ff5500;"></i> Control de Mesas
                    </span>
                    <span id="lblMesaSeleccionadaInfo" style="font-size: 0.8rem; font-weight: 800; color: #25D366;">
                        Mesa activa: Ninguna
                    </span>
                </div>
                <div class="mesas-grid" id="mesasGridContainer">
                    <!-- Carga dinámica de mesas -->
                </div>
            </div>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="posSearch" class="search-bar" placeholder="Buscar platillo..." oninput="buscarProducto()">
                <button id="clearSearchBtn" class="clear-search-btn" onclick="limpiarBuscador()"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <nav class="categories-nav" id="categoriesNav" style="flex: 1; margin-bottom: 0; padding-bottom: 5px;">
                    <!-- Carga dinámica -->
                </nav>
                <button type="button" class="filter-btn-custom" onclick="abrirModalOtroProducto()" style="background: linear-gradient(135deg, #ff5500, #ff8c00); color: #fff; border: none; border-radius: 30px; padding: 10px 18px; font-weight: 800; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3); flex-shrink: 0;">
                    <i class="fa-solid fa-plus-circle"></i> + Otro
                </button>
            </div>

            <div class="pos-grid" id="menuContainer">
                <!-- Carga dinámica -->
            </div>
        </div>

        <!-- ÁREA DERECHA: NOTA DE VENTA Y TICKET -->
        <div class="pos-sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <h2 style="font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-receipt" style="color: #ff5500;"></i> <span id="lblTituloTicket">Detalle del Ticket</span>
                </h2>
                <!-- BOTÓN PRE-CUENTA EN MODO MESA -->
                <button id="btnPreCuentaMesa" onclick="imprimirPreCuentaMesa()" style="display: none; background: #222; color: #ff944d; border: 1px solid rgba(255,148,77,0.3); padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer;">
                    <i class="fa-solid fa-print"></i> Pre-Cuenta
                </button>
            </div>
            
            <div id="posItemsList" class="ticket-list">
                <!-- Carga dinámica -->
            </div>

            <!-- APARTADO DE IMPORTES -->
            <div style="background: #161616; padding: 14px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.85rem; color: #9e9e9e; font-weight: 600;">TOTAL NETO</span>
                <strong id="posTotal" style="font-size: 1.6rem; color: #ff5500;">$0.00</strong>
            </div>

            <!-- SECCIÓN DE LIQUIDACIÓN -->
            <div style="background: rgba(255,255,255,0.01); padding: 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.03);">
                
                <!-- CASILLA Y MONTO DE ENVÍO -->
                <div style="background: #161616; padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.04);">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="color: #fff; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="chkEnvio" onchange="toggleControlEnvio()" style="width: 18px; height: 18px; accent-color: #ff5500; cursor: pointer;">
                            <span>🚚 Agregar Envío</span>
                        </label>
                        <div id="containerMontoEnvio" style="display: none; align-items: center; gap: 4px;">
                            <span style="color: #888; font-size: 0.85rem;">$</span>
                            <input type="number" id="montoEnvio" class="pos-input" value="30" min="0" step="any" style="width: 70px; margin-bottom: 0; padding: 6px 8px; font-weight: 700; text-align: right;" oninput="actualizarUIPOS()">
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="color: #666; font-size: 0.75rem; display: block; margin-bottom: 4px; font-weight: 600;">FORMA PAGO</label>
                        <select id="posPaymentMethod" class="pos-input" onchange="alternarCamposEfectivo()">
                            <option value="Efectivo">💵 Efectivo</option>
                            <option value="Tarjeta">💳 Tarjeta</option>
                            <option value="Transferencia">📲 SPEI</option>
                        </select>
                    </div>
                    <div id="efectivoInputControl">
                        <label style="color: #666; font-size: 0.75rem; display: block; margin-bottom: 4px; font-weight: 600;">PAGA CON</label>
                        <input type="number" id="pagaCon" class="pos-input" placeholder="0.00" step="any" oninput="calcularCambio()">
                    </div>
                </div>

                <!-- Billetes Rápidos -->
                <div id="fastCashSection" class="fast-cash-container">
                    <div class="cash-pill" onclick="rapidoEfectivo(20)">$20</div>
                    <div class="cash-pill" onclick="rapidoEfectivo(50)">$50</div>
                    <div class="cash-pill" onclick="rapidoEfectivo(100)">$100</div>
                    <div class="cash-pill" onclick="rapidoEfectivo(200)">$200</div>
                    <div class="cash-pill" onclick="rapidoEfectivo(500)">$500</div>
                </div>

                <div id="efectivoSection" class="calc-box">
                    <span style="color: #9e9e9e; font-size: 0.8rem; font-weight: 600;">CAMBIO:</span>
                    <span id="cambioAEntregar" class="change-alert">$0.00</span>
                </div>

                <input type="text" id="posNotes" class="pos-input" placeholder="Cliente / Ref. (Opcional)">

                <!-- BOTÓN PRINCIPAL ACCIÓN DINÁMICA (REGISTRAR O GUARDAR A MESA) -->
                <div style="display: flex; gap: 8px;">
                    <button type="button" id="btnGuardarMesaTemporal" onclick="guardarComandaAMesaActual()" style="display: none; background: #222; color: #25D366; border: 1px solid #25D366; border-radius: 12px; padding: 14px; font-weight: 800; font-size: 0.9rem; cursor: pointer; flex: 1;">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar a Mesa
                    </button>
                    <button type="button" id="btnRegistrarVenta" class="submit-order-btn" style="background: linear-gradient(135deg, #ff5500, #ff8c00); border-radius: 12px; padding: 14px; transition: all 0.3s; flex: 2;" onclick="procesarVentaPOS()">
                        <i class="fa-solid fa-bolt"></i> Registrar Venta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA AGREGAR PRODUCTO LIBRE / ESPECIAL -->
    <div id="customProductModal" class="pos-modal-overlay">
        <div class="pos-modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; margin-bottom: 15px;">
                <h3 style="color: #fff; font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-utensils" style="color: #ff5500;"></i> Producto Especial
                </h3>
                <button type="button" onclick="cerrarModalOtroProducto()" style="background: rgba(255,255,255,0.05); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem;">&times;</button>
            </div>

            <form onsubmit="agregarProductoEspecialAlCarrito(event)">
                <label style="color: #aaa; font-size: 0.78rem; font-weight: 700; display: block; margin-bottom: 4px;">NOMBRE / DESCRIPCIÓN</label>
                <input type="text" id="customProdName" class="pos-input" placeholder="Ej. 1/2 Kg de Bistec entero" required style="margin-bottom: 12px;">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <div>
                        <label style="color: #aaa; font-size: 0.78rem; font-weight: 700; display: block; margin-bottom: 4px;">PRECIO ($)</label>
                        <input type="number" step="any" id="customProdPrice" class="pos-input" placeholder="0.00" required>
                    </div>
                    <div>
                        <label style="color: #aaa; font-size: 0.78rem; font-weight: 700; display: block; margin-bottom: 4px;">CANTIDAD</label>
                        <input type="number" id="customProdQty" class="pos-input" value="1" min="1" required>
                    </div>
                </div>

                <button type="submit" class="submit-order-btn" style="background: linear-gradient(135deg, #ff5500, #ff8c00); border-radius: 12px; padding: 12px; width: 100%;">
                    <i class="fa-solid fa-cart-plus"></i> Agregar al Ticket
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL OPCIÓN C: CONFIRMACIÓN DE IMPRESIÓN DE TICKET -->
    <div id="printConfirmModal" class="pos-modal-overlay">
        <div class="pos-modal-card" style="text-align: center;">
            <div style="font-size: 3rem; color: #25D366; margin-bottom: 10px;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 style="color: #fff; font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;">¡Venta Registrada!</h2>
            <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 22px;">¿Deseas imprimir el ticket para esta venta?</p>
            
            <div class="pos-modal-actions" style="display: flex; gap: 10px; justify-content: center;">
                <button type="button" class="submit-order-btn" onclick="confirmarImpresionYFinalizar()" style="background: linear-gradient(135deg, #25D366, #1eb854); padding: 12px 18px; border-radius: 12px; font-weight: 800; flex: 1;">
                    <i class="fa-solid fa-print"></i> Imprimir Ticket
                </button>
                <button type="button" class="submit-order-btn" onclick="cerrarModalImpresionSinImprimir()" style="background: #222; color: #aaa; border: 1px solid rgba(255,255,255,0.1); padding: 12px 18px; border-radius: 12px; font-weight: 700; flex: 1;">
                    ❌ No, Continuar
                </button>
            </div>
        </div>
    </div>

    <script src="pos.js"></script>
</body>
</html>
